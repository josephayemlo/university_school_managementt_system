
<h3 class="form_title">Create Group Chat</h3>

<form method="post" class="ajax_form custom_form" action="{% url 'create_group_chat_room' %}" >
  {% csrf_token %}
  {% include 'management/partials/form_fields_template.html' with form=form %}
  <!-- MESSAGES -->
 <div>
  {% if messages %}
    {% for message in messages %}
      <div class="form_messages">
        {{ message }}
      </div>
    {% endfor %}
{% endif %}
</div>
<!-- MESSAGES -->

  <button type="submit" class="btn">Create</button>
</form>
<div id="ajax_form_response"></div>
