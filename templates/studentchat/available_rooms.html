<h2>Available Group Chat Rooms</h2>

{% for room in rooms %}
  <div>
    <strong>{{ room.name }}</strong>
    {% if room.id in joined_room_ids %}
      <a class="ajax_link" href="{% url 'group_chat' room.id %}">Enter Chat</a>
    {% else %}
      <form class="ajax_form" method="post" action="{% url 'join_group_room' room.id %}">
        {% csrf_token %}
        <button type="submit">Join Room</button>
      </form>
    {% endif %}
  </div>
{% endfor %}
