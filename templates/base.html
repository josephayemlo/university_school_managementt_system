{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community College USA</title>
    <meta name="viewport" content="width=device-width, initial-scal=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900"
      rel="stylesheet"
    />
    <link rel="stylesheet" href=" {% static 'css/main.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Font Awesome CDN -->
  </head>
  <body>
    <!-- Making Header excludable start -->
    {% block header %} {% include 'includes/header.html' %} {% endblock header
    %}
    <!-- Making Header excludable end -->

    <!-- Main body  Start -->
    <div>{% block content %} {% endblock content%}</div>
    <!-- Main body  End -->

    <!-- Making footer excludable start-->
    {% block footer %} {% include 'includes/footer.html' %} {% endblock footer
    %}
    <!-- Making footer excludable end-->

    <!-- Global scripts start -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="{% static 'js/ajax.js' %}"></script>

    <script src="{% static 'js/management_home.js' %}"></script>
    <script src="{% static 'js/hamburger_nav.js' %}"></script>
    <script src="{% static 'js/studentportal.js' %}"></script>

    <!-- Global scripts end -->
  </body>
</html>
