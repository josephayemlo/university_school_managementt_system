{% load static %}
<!doctype html>
<html lang="en">
    <head>   
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Imperial College London</title>
        <meta name="viewport" content="width=device-width, initial-scal=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900"
      rel="stylesheet"
    />
    <link rel="stylesheet" href=" {% static 'css/main.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>  
  <body>
<!-- Making Header excludable in any page -->
      {% block header %} 
        {% include 'includes/header.html' %} 
      {% endblock header %}

      <!-- Main body  Start -->
      <div>
          {% block content %}
          {% endblock content%}
      </div>                
      <!-- Main body  End -->

<!-- Making footer excludable in any page -->
      {% block footer %} 
          {% include 'includes/footer.html' %} 
      {% endblock footer %}

<!-- Javascript File -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  // ✅ Handle AJAX link clicks
  $(document).on("click", ".ajax_link", function(e) {
    e.preventDefault();
    const url = $(this).attr("href");
    $("#ajaxContainer").html("<p>Loading...</p>");

    $.ajax({
      url: url,
      type: "GET",
      success: function(response) {
        $("#ajaxContainer").html(response);
      },
      error: function(xhr) {
        $("#ajaxContainer").html("<p style='color:red;'>Error loading page.</p>");
      }
    });
  });

  // ✅ Handle AJAX form submission
  $(document).on("submit", "form.ajax_form", function(e) {

    e.preventDefault();

    const form = $(this);
    const url = form.attr("action");
    const formData = form.serialize();

    $.ajax({
      url: url,
      type: "POST",
      data: formData,
      headers: {
        "X-CSRFToken": getCookie("csrftoken")
      },
      success: function(response) {
        $("#ajaxContainer").html(response);
      },
      error: function(xhr) {
        $("#ajaxContainer").html("<p style='color:red;'>Submission failed.</p>");
      }
    });
  });
</script>
    </body>
    
</html>
