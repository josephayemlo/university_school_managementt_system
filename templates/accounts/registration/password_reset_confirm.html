{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2 class="auth-title">Set a New Password</h2>
    <form method="POST" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>
</section>
{% endblock %}
