{% load static %}
{% for field in form.visible_fields %}
  <div class="form_group {% if field.errors %}has_error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form_label">{{ field.label }}</label>
    {{ field }}
    
    {% if field.help_text %}
      <small class="form_help">{{ field.help_text }}</small>
    {% endif %}
    
    {% for error in field.errors %}
      <div class="form_error">{{ error }}</div>
    {% endfor %}
  </div>
{% endfor %}
