
   
<h3 class="form_title">select department to proceed</h3>

<!-- Back Btn start -->
<a class=" tableBtn1 ajax_link" href="{% url 'admin_result_and_assessment' %}">
    <i class="fas fa-arrow-left"></i> Back
  </a>
  <!-- Back Btn end -->
  
   
   <div class="tableContainer">
    <div class="tableHeading">
        <span class="tableHeading10">SN</span>
        <span class="tableHeading1">Department Name</span>
        <span class="tableHeading1">Faculty</span>
        <span class="tableHeading1">Link</span>

    </div>
    {% if department  %}
          {% for department in department %}
    <div class="tableData">
        <span class="tableHeading10">{{ forloop.counter }}</span>
        <span class="tableHeading1">{{department.name}}</span>
        <span class="tableHeading1">{{department.faculty}}</span>
        <span class="tableHeading1"><a href="{% url 'admin_result_department_course' department.id %}" class=" generalAdminBtn ajax_link">Proceed</a></span>
       
    </div>

    {% endfor %}
    {% else %}
            <h2>No department available</h2>
    {% endif %}
