
<h3 class="form_title">Update Admission Status</h3>

<form method="post" class="ajax_form custom_form" action="{% url 'change_addmission_status' aspirant.id %}">
    
  {% csrf_token %}
  {% include 'management/partials/form_fields_template.html' with form=form %}
   <!-- MESSAGES -->
 <div>
  {% if messages %}
    {% for message in messages %}
      <div class="form_messages">
        {{ message }}
      </div>
    {% endfor %}
{% endif %}
</div>
<!-- MESSAGES -->

  <button type="submit" class="btn">Update</button>
</form>
<div id="ajax_form_response"></div>
