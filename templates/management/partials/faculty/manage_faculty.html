
   
<h3 class="form_title">Manage Faculty | Faculty List</h3>
    <!-- Back Btn start -->
 <a class=" tableBtn1 ajax_link" href="{% url 'admin_department_and_faculty' %}">
  <i class="fas fa-arrow-left"></i> Back
</a>
<!-- Back Btn end -->
   <div class="tableContainer">
      <div class="tableHeading">
          <span class="tableHeading10">SN</span>
          <span class="tableHeading1">Faculty</span>
          <span class="tableHeading1">Edit/Delete</span>
      </div>
      {% if faculty  %}
            {% for faculty in faculty %}
      <div class="tableData">
          <span class="tableHeading10">{{ forloop.counter }}</span>
          <span class="tableHeading1">{{faculty.name}}</span>
          <span class="tableHeading1"> 
            <a href="{% url  'admin_edit_faculty' faculty.id %}" class="tableBtn1 ajax_link">Edit</a> - 
            <form method="post" class="ajax_form  ajax_delete_form" 
                action="{% url 'admin_delete_faculty' faculty.id %}"
                onsubmit="this.querySelector('button[type=submit]').disabled = true;"
            >
              {% csrf_token %}
              <button type="submit" class="tableBtn2">Delete</button>
            </form>
          </span>
      </div>

      {% endfor %}
      {% else %}
              <h2>No faculty available</h2>
      {% endif %}
